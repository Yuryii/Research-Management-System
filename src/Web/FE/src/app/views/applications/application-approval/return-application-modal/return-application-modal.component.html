<p-toast></p-toast>
<div class="return-form">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label cLabel for="returnTitle">Tiêu đề</label>
      <input
        id="returnTitle"
        type="text"
        cFormControl
        formControlName="title"
        placeholder="Nhập tiêu đề thông báo"
        [ngClass]="{ 'is-invalid': form.controls['title'].invalid && form.controls['title'].touched }"
      />
      <div class="invalid-feedback" *ngIf="form.controls['title'].invalid && form.controls['title'].touched">
        Tiêu đề là bắt buộc.
      </div>
    </div>

    <div class="mb-3">
      <label cLabel for="returnDescription">Nội dung</label>
      <textarea
        id="returnDescription"
        cFormControl
        formControlName="description"
        rows="4"
        placeholder="Nhập nội dung thông báo"
        [ngClass]="{ 'is-invalid': form.controls['description'].invalid && form.controls['description'].touched }"
      ></textarea>
      <div class="invalid-feedback" *ngIf="form.controls['description'].invalid && form.controls['description'].touched">
        Nội dung là bắt buộc.
      </div>
    </div>

    <div class="mb-3">
      <label cLabel>Tài liệu đính kèm (không bắt buộc)</label>
      <p-fileUpload
        [multiple]="true"
        [showUploadButton]="false"
        [showCancelButton]="true"
        [maxFileSize]="10485760"
        (onSelect)="onSelect($event)"
        (onRemove)="onRemove($event)"
        (onClear)="onClear()"
        [fileLimit]="5"
        accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg"
        invalidFileSizeMessageDetail="Kích thước tệp không được vượt quá 10MB."
        invalidFileLimitMessageDetail="Tối đa 5 tệp."
        chooseLabel="Chọn tệp"
        cancelLabel="Hủy"
        auto="true"
      >
      </p-fileUpload>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
      <button cButton color="secondary" type="button" (click)="close()">
        Hủy
      </button>
      <button cButton color="primary" type="submit" [disabled]="isSubmitting">
        <span *ngIf="isSubmitting">Đang xử lý...</span>
        <span *ngIf="!isSubmitting">Trả hồ sơ</span>
      </button>
    </div>
  </form>
</div>
