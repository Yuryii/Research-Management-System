<div>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label cLabel for="titleFormControlInput">Tiêu đề</label>
      <input
        cFormControl
        id="titleFormControlInput"
        placeholder="Nhập tiêu đề"
        type="text"
        formControlName="title"
      />
      <div
        *ngIf="form.get('title')?.invalid && form.get('title')?.touched"
        class="text-danger mt-1"
      >
        <small *ngIf="form.get('title')?.errors?.['required']">
          Tiêu đề là bắt buộc.
        </small>
        <small *ngIf="form.get('title')?.errors?.['maxlength']">
          Tiêu đề không được vượt quá 100 ký tự.
        </small>
      </div>
    </div>
    <div class="mb-3">
      <label cLabel for="descriptionFormControlTextarea">Nội dung</label>
      <textarea
        cFormControl
        id="descriptionFormControlTextarea"
        placeholder="Nhập nội dung"
        rows="3"
        formControlName="description"
      ></textarea>
      <div
        *ngIf="
          form.get('description')?.invalid && form.get('description')?.touched
        "
        class="text-danger mt-1"
      >
        <small *ngIf="form.get('description')?.errors?.['required']">
          Nội dung là bắt buộc.
        </small>
        <small *ngIf="form.get('description')?.errors?.['maxlength']">
          Nội dung không được vượt quá 500 ký tự.
        </small>
      </div>

      <label class="mt-3">Tài liệu đính kèm</label>
      <div class="card mt-2">
        <p-fileupload
          (onClear)="onClear()"
          (onRemove)="onRemove($event)"
          (onSelect)="onSelect($event)"
          name="demo[]"
          url="https://www.primefaces.org/cdn/api/upload.php"
          (onUpload)="onUpload($event)"
          [multiple]="true"
          accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          maxFileSize="1000000"
          mode="advanced"
        >
          <ng-template #empty>
            <div>Drag and drop files to here to upload.</div>
          </ng-template>
        </p-fileupload>
        <div
          class="d-flex align-items-center justify-content-between gap-3 px-3 pb-3 pt-2"
        >
          <small class="text-medium-emphasis">
            {{ uploadedFiles.length }} tệp đã được đính kèm
          </small>
          <button
            (click)="downloadAllFiles()"
            [disabled]="!uploadedFiles.length || isDownloadingAll"
            class="btn btn-outline-secondary"
            type="button"
          >
            {{ isDownloadingAll ? "Đang nén..." : "Tải tất cả - zip files" }}
          </button>
        </div>
      </div>
    </div>
    <div class="form-check form-switch mb-3">
      <input
        class="form-check-input"
        type="checkbox"
        id="draftSwitch"
        formControlName="isDraft"
      />
      <label class="form-check-label" for="draftSwitch">Nộp Ngay</label>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-3">
      <button type="button" class="btn btn-secondary" (click)="close()">
        Hủy
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
        Tạo
      </button>
    </div>
  </form>
</div>
