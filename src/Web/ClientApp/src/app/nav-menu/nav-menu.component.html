<header>
  <!-- Main White Nav -->
  <div class="main-nav-container">
    <nav>
      <!-- Left: Logo -->
      <ul>
        <li>
          <a class="nav-brand" [routerLink]="['/']"
            style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
            <img src="/assets/logo.png" alt="DNTU Logo"
              style="height: 90px; width: auto; border-radius: 0; object-fit: contain;">

          </a>
        </li>
      </ul>

      <!-- Middle: Centered Navigation -->
      <div class="nav-center">
        <ul>
          <li><a [routerLink]="['/']" [routerLinkActive]="['pico-active']"
              [routerLinkActiveOptions]="{ exact: true }">HOME</a></li>
          <li><a [routerLink]="['/counter']" [routerLinkActive]="['pico-active']">COUNTER</a></li>
          <li><a [routerLink]="['/weather']" [routerLinkActive]="['pico-active']">WEATHER</a></li>
          @if (isAuthenticated$ | async){
          <li><a [routerLink]="['/todo']" [routerLinkActive]="['pico-active']">TASKS</a></li>
          }

        </ul>
      </div>

      <!-- Right: Auth and Utils -->
      <div class="nav-right">
        <ul>
          @if (isAuthenticated$ | async) {
          <li><a href="#" (click)="logout($event)">ĐĂNG XUẤT</a></li>
          } @else {
          <li><a [routerLink]="['/login']">ĐĂNG NHẬP</a></li>
          }
          <li><app-theme-toggle /></li>
        </ul>
      </div>
    </nav>
  </div>
</header>
