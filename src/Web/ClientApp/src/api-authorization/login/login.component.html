<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="card my-5">
        <div class="card-body">
          <form (ngSubmit)="login()" #loginForm="ngForm">
            <a href="#" class="d-flex justify-content-center">
              <img src="/assets/logo.png" alt="DNTU Logo"
                   style="height:80px; width: auto; border-radius: 0; object-fit: contain;">
            </a>
            <div class="row">
              <div class="d-flex justify-content-center">
                <div class="auth-header">
                  <h2 class="text-secondary mt-5"><b>Hi, Welcome Back</b></h2>
                  <p class="fs-4 mt-2">Enter your credentials to continue</p>
                </div>
              </div>
            </div>
            <div class="d-grid">
              <button type="button" class="btn mt-2 btn-light-primary bg-light text-muted">
                <img src="assets/images/authentication/google-icon.svg" alt="google" />
                Sign In With Google
              </button>
            </div>
            <div class="saprator mt-3">
              <span>or</span>
            </div>
            <h5 class="my-4 d-flex justify-content-center">Sign in with Email address</h5>
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="floatingInput" name="email" [(ngModel)]="email"
                     [class.is-invalid]="invalid" placeholder="Email Address" required />
              <label for="floatingInput">Email address / Username</label>
            </div>
            <div class="form-floating mb-3 position-relative">
              <input [type]="showPassword ? 'text' : 'password'" id="password" class="form-control pe-5" name="password"
                     [(ngModel)]="password" [class.is-invalid]="invalid" placeholder="Password (min. 8 characters)"
                     required />
              <label for="password">Password</label>
              <button type="button"
                      class="btn btn-link position-absolute end-0 text-muted text-decoration-none p-2 me-1"
                      style="z-index: 5; top: 29px; transform: translateY(-50%); outline: none; box-shadow: none;" (click)="togglePassword()" tabindex="-1">
                <i [class]="showPassword ? 'ti ti-eye-off' : 'ti ti-eye'" style="font-size: 1.25rem;"></i>
              </button>
            </div>
            <div class="d-flex mt-1 justify-content-between">
              <div class="form-check">
                <input class="form-check-input input-primary" type="checkbox" id="customCheckc1" checked />
                <label class="form-check-label text-muted" for="customCheckc1">Remember me</label>
              </div>
              <h5 class="text-secondary">
                <a href="javascript:">Forgot Password?</a>
              </h5>
            </div>
            @if (invalid) {
            <div class="alert alert-danger mt-3" role="alert">
              Invalid email or password.
            </div>
            }
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-secondary">Sign In</button>
            </div>
            <hr />
            <h5 class="d-flex justify-content-center">
              <a [routerLink]="['/register']">Don't have an account?</a>
            </h5>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
